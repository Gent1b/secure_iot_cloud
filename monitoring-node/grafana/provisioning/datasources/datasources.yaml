apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: "${INFLUXDB_URL}"
    isDefault: true
    jsonData:
      httpMode: POST
      organization: "${INFLUXDB_ORG}"
      version: Flux
      defaultBucket: "${INFLUXDB_BUCKET}"
    secureJsonData:
      token: "${INFLUXDB_TOKEN}"

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false

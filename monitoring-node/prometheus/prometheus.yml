global:
  scrape_interval: 5s

scrape_configs:

  # ========= CLOUD NODE =========
  - job_name: 'telegraf'
    static_configs:
      - targets: ['172.31.33.61:9273']   # telegraf on cloud-node

  - job_name: 'subscriber'
    static_configs:
      - targets: ['172.31.33.61:8000']   # subscriber metrics

  - job_name: 'cloud_node_exporter'
    static_configs:
      - targets: ['172.31.33.61:9100']   # your cloud-node internal IP


  # ========= MQTT NODE =========
  # - job_name: 'broker_monitor'
  #   static_configs:
  #     - targets: ['172.31.39.30:8001']    # broker monitor metrics (DISABLED)

  - job_name: 'mqtt_monitor'
    static_configs:
      - targets: ['172.31.39.30:9273']    # MQTT telegraf metrics
  # ========= DEVICE NODE =========
  - job_name: '[publishers]'
    static_configs:
      - targets: ['172.31.44.105:9273']    # Publishers metrics

  # ========= NODE EXPORTER (DISABLED) =========
  # You don’t have node exporter yet — uncomment later if installed.
  #
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets:
  #         - '172.31.35.174:9100'   # cloud-node
  #         - '172.31.39.30:9100'   # mqtt-node
  #         - '172.31.38.156:9100'  # devices-node
  #         - '172.31.42.61:9100'   # monitoring-node

services:
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
    env_file:
      - /opt/iot/.env
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "admin"
      DOCKER_INFLUXDB_INIT_PASSWORD: "admin123"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUXDB_ORG:-secure_iot}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUXDB_BUCKET:-iot_data}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_TOKEN:-local_token_123}"
    restart: unless-stopped

  subscriber:
    build:
      context: ../subscriber
    image: iot-subscriber:local
    pull_policy: never
    env_file:
      - /opt/iot/.env
    environment:
      BROKER: "${BROKER}"
      INFLUXDB_URL: "${INFLUXDB_URL}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN}"
      INFLUXDB_ORG: "${INFLUXDB_ORG}"
      INFLUXDB_BUCKET: "${INFLUXDB_BUCKET}"
      MODE: "CLOUD"
      MQTT_TOPIC: "iot/data/#"
      # THESIS ALIGNMENT: Trust edge detection in dynamic scenario
      DEPLOYMENT_MODE: "edge"
      RUN_ID: "${RUN_ID:-run_unknown}"
      SCENARIO: "${SCENARIO:-adaptive}"
    ports:
      - "8000:8000"
    depends_on:
      - influxdb
    restart: unless-stopped

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: iot-controller:local
    pull_policy: never
    env_file:
      - /opt/iot/.env
    environment:
      BROKER: "${BROKER}"
      INFLUXDB_URL: "${INFLUXDB_URL}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN}"
      INFLUXDB_ORG: "${INFLUXDB_ORG}"
      INFLUXDB_BUCKET: "${INFLUXDB_BUCKET}"
      PROMETHEUS_URL: "${PROMETHEUS_URL}"
      RUN_ID: "${RUN_ID:-run_unknown}"
      SCENARIO: "${SCENARIO:-adaptive}"
      CPU_HIGH: "${CPU_HIGH:-80}"
      CPU_LOW: "${CPU_LOW:-20}"
      MEM_HIGH: "${MEM_HIGH:-85}"
      MEM_LOW: "${MEM_LOW:-65}"
    depends_on:
      - influxdb
      - subscriber
    ports:
      - "8001:8000"
    restart: unless-stopped
    
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    network_mode: host
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

  telegraf:
      image: telegraf:latest
      container_name: telegraf
      privileged: true
      security_opt:
        - apparmor=unconfined
      user: root
      
      # === CRITICAL FIX: ADD THIS SECTION ===
      group_add:
        - 988  # This is the GID for the 'docker' group (docker:x:988:...)
      # ======================================
      
      volumes:
        - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
        - /var/run/docker.sock:/var/run/docker.sock
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /etc:/host/etc:ro
      environment:
        - HOST_PROC=/host/proc
        - HOST_SYS=/host/sys
        - HOST_ETC=/host/etc
      ports:
        - "9273:9273"
      restart: unless-stopped
